          - title: "Useful chat messages"
            icon: wallet
            question: "How do you save useful information from a busy chat?"
            scope: "saving and retrieval"
          - title: "Confusing instructions"
            icon: laptop
            question: "Which online instruction was hard to follow?"
            scope: "steps and ambiguity"
          - title: "A fast video lesson"
            icon: graduation-cap
            question: "What do you do when a video lesson moves too quickly?"
            scope: "playback and note-taking"
          - title: "Without my device"
            icon: briefcase
            question: "How did you solve a problem without your usual device?"
            scope: "workarounds and troubleshooting"
      - title: Places to Spend Time
        lessons:
          - title: "Working alone"
            icon: map-pin
            question: "Which local place is good for working alone?"
            scope: "quiet spaces and concentration"
          - title: "A park worth revisiting"
            icon: plane
            question: "What would make a park worth visiting again?"
            scope: "facilities and upkeep"
          - title: "Library or cafe"
            icon: coffee
            question: "How do you choose between a library and a cafe?"
            scope: "atmosphere and practical comparisons"
          - title: "Finding local history"
            icon: plane
            question: "Where can visitors learn about your town without a guide?"
            scope: "exhibits and self-guided visits"
          - title: "A new neighborhood"
            icon: home
            question: "What do you notice first in an unfamiliar neighborhood?"
            scope: "street features and impressions"
      - title: Healthy Habits
        lessons:
          - title: "Exercise that sticks"
            icon: dumbbell
            question: "What makes a short exercise routine easy to maintain?"
            scope: "routines and motivation"
          - title: "After a busy week"
            icon: bed
            question: "How do you recover after a busy week?"
            scope: "rest and recovery"
          - title: "A useful reminder"
