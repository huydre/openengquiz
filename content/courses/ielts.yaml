  - slug: advanced-1
    title: Nâng cao 1
    cefr: C1
    words: 10
    summary: Xử lý chủ đề trừu tượng và phân biệt lập luận với bằng chứng.
    entry: Dùng được lập luận có điều kiện và diễn đạt lại khi thiếu từ.
    outcome: Phân tích giả định, độ chắc chắn và tác dụng ngoài dự kiến.
    method: So sánh hai khung lập luận rồi luyện thay đổi giọng theo người nghe.
    parts:
      - title: Evidence and Uncertainty
        lessons:
