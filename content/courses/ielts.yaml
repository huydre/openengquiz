  - slug: band-6
    title: Band 6
    cefr: B2
    words: 10
    summary: Nêu quan điểm có đối chiếu và ví dụ đúng trọng tâm.
    entry: Kể được trải nghiệm và giải thích lý do trên vài chủ đề quen thuộc.
    outcome: Phát triển luận điểm có so sánh, điều kiện và hệ quả cụ thể.
    method: Luyện nói lần đầu có giới hạn thời gian rồi nói lại với cụm chính xác.
