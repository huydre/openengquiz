slug: ielts
goal: ielts
title: IELTS
levels:
  - slug: foundations
    title: Lấy gốc
    cefr: A1
    words: 8
    summary: Trả lời ngắn về người, nơi chốn và thói quen quen thuộc.
    entry: Chưa cần kiến thức IELTS; nhận biết bảng chữ cái và đọc từ đơn.
    outcome: Trả lời hai đến ba câu đơn có chủ ngữ, động từ và chi tiết cụ thể.
    method: Ghép cụm dễ nhớ với câu ngắn, nghe mẫu và thu âm lại.
    parts:
      - title: My Daily Routine
        lessons:
          - title: "After waking"
            icon: alarm-clock
            question: "What do you do right after you wake up?"
            scope: "morning actions and time markers"
          - title: "A short break"
            icon: coffee
            question: "When do you take a break in your day?"
            scope: "rest activities and frequency"
          - title: "Leaving home"
            icon: key
            question: "What do you carry when you leave home?"
            scope: "portable essentials and carrying verbs"
          - title: "Lunch company"
            icon: utensils
            question: "Who do you see at lunchtime?"
            scope: "people at lunch and meeting places"
          - title: "Bedtime"
            icon: bed
            question: "What helps you get ready for bed?"
            scope: "evening tasks and sequencing"
      - title: People Around Us
        lessons:
          - title: "Someone funny"
            icon: home
            question: "Who makes you laugh at home?"
            scope: "family members and reactions"
          - title: "After class"
            icon: users
            question: "Which friend do you talk to after class?"
            scope: "friendship and chatting"
          - title: "Next door"
            icon: home
            question: "What do you do with your neighbors?"
            scope: "neighbors and shared activities"
          - title: "Helping out"
            icon: bus
            question: "Who helps you when you are busy?"
            scope: "simple chores and offers of help"
          - title: "A new classmate"
            icon: graduation-cap
            question: "How do you greet a new classmate?"
            scope: "greetings and introductions"
      - title: Home and Belongings
        lessons:
          - title: "Keeping keys"
            icon: key
            question: "Where do you keep your keys?"
            scope: "storage places and prepositions"
          - title: "Window view"
            icon: sparkles
            question: "What can you see from your window?"
            scope: "nearby objects and position"
          - title: "A favorite seat"
            icon: home
            question: "Which seat do you use at home?"
            scope: "furniture and comfort"
          - title: "Inside my bag"
            icon: graduation-cap
            question: "What is in your school bag?"
            scope: "school items and containers"
          - title: "A tidy room"
            icon: home
            question: "How do you make your room tidy?"
            scope: "cleaning actions and arrangement"
      - title: Food and Shopping
        lessons:
          - title: "Breakfast drinks"
            icon: coffee
            question: "What do you like to drink with breakfast?"
            scope: "beverages and taste"
          - title: "Buying fruit"
            icon: shopping-bag
            question: "Which fruit do you buy most often?"
            scope: "fruit varieties and quantities"
          - title: "A quick lunch"
            icon: utensils
            question: "What do you put in a quick lunch?"
            scope: "ingredients and preparation"
          - title: "A smaller size"
            icon: sparkles
            question: "How do you ask for a smaller size?"
            scope: "size words and polite requests"
          - title: "Sunday shopping"
            icon: shopping-bag
            question: "Which shop do you visit on Sunday?"
            scope: "shop types and opening times"
      - title: Getting Around Town
        lessons:
          - title: "To the market"
            icon: bus
            question: "How do you get to the nearest market?"
            scope: "transport and everyday directions"
          - title: "Waiting for the bus"
            icon: map-pin
            question: "Where do you wait for a bus?"
            scope: "stops and waiting phrases"
          - title: "On the way to school"
            icon: graduation-cap
            question: "What do you see on your way to school?"
            scope: "street landmarks and motion"
          - title: "An easy landmark"
            icon: home
            question: "Which place is easy to find near your home?"
            scope: "places and location markers"
          - title: "Where to turn"
            icon: map-pin
            question: "How do you tell someone where to turn?"
            scope: "turning and street directions"
      - title: Free Time
        lessons:
          - title: "Rainy afternoon"
            icon: cloud-rain
            question: "What do you play on a rainy afternoon?"
            scope: "indoor games and weather"
          - title: "My free day"
            icon: clock
            question: "Which day gives you the most free time?"
            scope: "days and time expressions"
          - title: "A short walk"
            icon: bus
            question: "Where do you go for a short walk?"
            scope: "walking routes and outdoor places"
          - title: "Listening to relax"
            icon: sparkles
            question: "What do you listen to when you relax?"
            scope: "audio and feelings"
          - title: "Inviting a friend"
            icon: users
            question: "Who would you invite to play a game?"
            scope: "invitations and game actions"
  - slug: band-3-4
    title: Band 3 đến 4
    cefr: A2
    words: 8
    summary: Nối câu thành câu trả lời ngắn có lý do.
    entry: Có thể nói câu đơn về sinh hoạt và hỏi đáp thông tin cơ bản.
    outcome: Duy trì câu trả lời ngắn, kể việc đã làm và nêu lựa chọn đơn giản.
    method: Tập trả lời theo mẫu ý chính, lý do và ví dụ thật.
    parts:
      - title: Habits and Reasons
        lessons:
          - title: "Best study time"
            icon: graduation-cap
            question: "Why do you choose one time of day to study?"
            scope: "energy and time preferences"
          - title: "A changed morning"
            icon: alarm-clock
            question: "How has your morning routine changed this year?"
            scope: "routine changes and time contrast"
          - title: "An easier weekday"
            icon: calendar
            question: "What makes a weekday easier for you?"
            scope: "planning and helpful actions"
          - title: "A borrowed habit"
            icon: graduation-cap
            question: "Which habit did you learn from someone else?"
            scope: "learning by example and frequency"
          - title: "Remembering tasks"
            icon: laptop
            question: "How do you remember small tasks?"
            scope: "reminders and simple tools"
      - title: Plans and Appointments
        lessons:
          - title: "Meeting friends"
            icon: users
            question: "How do you arrange a meeting with friends?"
            scope: "proposals and arrangements"
          - title: "Arriving early"
            icon: clock
            question: "What do you do when you arrive too early?"
            scope: "waiting and spare time"
          - title: "Running late"
            icon: users
            question: "How do you tell people that you will be late?"
            scope: "delays and apologies"
          - title: "Changing plans"
            icon: calendar
            question: "What plan did you change last weekend?"
            scope: "cancellations and alternatives"
          - title: "A free morning"
            icon: alarm-clock
            question: "Which activity would you schedule for a free morning?"
            scope: "scheduling and priorities"
      - title: Places and Services
        lessons:
          - title: "Choosing a room"
            icon: home
            question: "What do you check before choosing a room?"
            scope: "facilities and room features"
          - title: "Asking for quiet"
            icon: sparkles
            question: "How would you ask for a quieter room?"
            scope: "noise and polite requests"
          - title: "A useful stay"
            icon: map-pin
            question: "What was useful in a place where you stayed?"
            scope: "lodging amenities and descriptions"
          - title: "Help for a visitor"
            icon: plane
            question: "Where would you send a visitor for help?"
            scope: "public services and referrals"
          - title: "A broken light"
            icon: newspaper
            question: "How do you report a broken light politely?"
            scope: "reporting faults and repairs"
      - title: Everyday Choices
        lessons:
          - title: "Ordering in a cafe"
            icon: coffee
            question: "How do you decide what to order in a cafe?"
            scope: "menus and preferences"
          - title: "A shop worth returning to"
            icon: shopping-bag
            question: "What makes you return to a small shop?"
            scope: "service and customer habits"
          - title: "Snacks for a trip"
            icon: plane
            question: "Which snack would you bring on a long trip?"
            scope: "durability and portions"
          - title: "Buying shoes"
            icon: shopping-bag
            question: "How did you choose your last pair of shoes?"
            scope: "fit and comparisons"
          - title: "Asking an assistant"
            icon: sparkles
            question: "When do you ask a shop assistant for advice?"
            scope: "recommendations and purchase criteria"
      - title: In the Classroom
        lessons:
          - title: "Before a hard class"
            icon: graduation-cap
            question: "What do you do before a difficult class?"
            scope: "preparation and study materials"
          - title: "Repeat that please"
            icon: sparkles
            question: "How do you ask someone to repeat an instruction?"
            scope: "instructions and clarification"
          - title: "Last week’s task"
            icon: graduation-cap
            question: "What was your favorite task last week?"
            scope: "classroom activities and past actions"
          - title: "Remembering in class"
            icon: sparkles
            question: "Which class activity helps you remember more?"
            scope: "practice and recall"
          - title: "A short presentation"
            icon: book-open
            question: "How do you prepare for a short presentation?"
            scope: "rehearsal and speaking aids"
      - title: Recent Experiences
        lessons:
          - title: "An outing surprise"
            icon: calendar
            question: "What surprised you on a recent outing?"
            scope: "reactions and unexpected events"
          - title: "Company on a walk"
            icon: users
            question: "Who joined you on a memorable walk?"
            scope: "companions and shared memories"
          - title: "Caught in the rain"
            icon: cloud-rain
            question: "What did you do when it started to rain?"
            scope: "weather and quick decisions"
          - title: "A photo to share"
            icon: users
            question: "Which picture from last month would you show a friend?"
            scope: "images and description"
          - title: "An unexpected day off"
            icon: shopping-bag
            question: "How did you spend an unexpected day off?"
            scope: "leisure and changes in schedule"
  - slug: band-45-55
    title: Band 4.5 đến 5.5
    cefr: B1
    words: 10
    summary: Phát triển ý bằng chi tiết, ví dụ và trình tự rõ.
    entry: Nói được vài câu nối nhau về chủ đề quen thuộc.
    outcome: Kể một trải nghiệm mạch lạc và trả lời câu hỏi tiếp nối.
    method: Chuẩn bị ba ý, kể theo mốc thời gian và sửa lỗi lặp lại.
    parts:
      - title: A Memorable Event
        lessons:
          - title: "A hard-won achievement"
            icon: sparkles
            question: "What small achievement took more effort than you expected?"
            scope: "effort and milestones"
          - title: "A delay that helped"
            icon: plane
            question: "When did a delayed journey turn out well?"
            scope: "travel disruptions and outcomes"
          - title: "Cooking for a group"
            icon: utensils
            question: "What happened the first time you cooked for other people?"
            scope: "preparation and serving"
          - title: "An unexpected invitation"
            icon: sparkles
            question: "How did you react to an unexpected invitation?"
            scope: "spontaneous decisions and reactions"
          - title: "A day worth reliving"
            icon: sun
            question: "Which ordinary day would you like to relive?"
            scope: "recollection and sensory details"
      - title: People Who Inspire Us
        lessons:
          - title: "Discovering a subject"
            icon: coffee
            question: "Who helped you enjoy a subject you once disliked?"
            scope: "motivation and teaching"
          - title: "Trying a hobby"
            icon: users
            question: "When did a friend change your mind about a hobby?"
            scope: "persuasion and changed opinions"
          - title: "Learning independence"
            icon: coffee
            question: "What did a relative teach you to do independently?"
            scope: "practical guidance and autonomy"
          - title: "A good teammate"
            icon: users
            question: "Which quality makes a teammate easy to work with?"
            scope: "cooperation and reliability"
          - title: "After a mistake"
            icon: sparkles
            question: "How did someone encourage you after a mistake?"
            scope: "encouragement and recovery"
      - title: Digital Tools for Study and Work
        lessons:
          - title: "A helpful digital tool"
