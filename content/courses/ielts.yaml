  - slug: band-7
    title: Band 7
    cefr: C1
    words: 10
    summary: Lập luận linh hoạt và xử lý câu hỏi phản biện.
    entry: Diễn giải được hai mặt của vấn đề và đưa ví dụ phù hợp.
    outcome: Nêu sắc thái, ngoại lệ và điều kiện mà không mất mạch lập luận.
    method: Luyện phản biện, diễn đạt lại và đối chiếu hai bản nói để sửa lỗi.
    parts:
      - title: Energy and Transition
        lessons:
          - title: "Affordable reliable energy"
            icon: shopping-bag
            question: "How should a town balance cheaper energy with reliable supply?"
            scope: "price stability and grid reliability"
          - title: "Subsidies and inequality"
            icon: leaf
            question: "When might an energy subsidy widen inequality?"
            scope: "eligibility and distribution"
          - title: "Justifying a retrofit"
            icon: wallet
            question: "What makes a home retrofit difficult to justify?"
            scope: "upfront costs and payback"
          - title: "Siting renewables"
            icon: map-pin
            question: "How can a community agree on where to place renewable infrastructure?"
            scope: "consultation and land use"
          - title: "Who pays for energy savings"
            icon: wallet
            question: "Which energy-saving policies might unfairly burden tenants?"
            scope: "tenant obligations and cost shifting"
      - title: Technology and Trust
        lessons:
          - title: "Challenging an algorithm"
            icon: laptop
            question: "When should a person be able to contest an automated decision?"
            scope: "appeals and automated decisions"
          - title: "Is that data needed"
            icon: users
            question: "How can people judge whether a service needs their data?"
            scope: "purpose limitation and consent"
          - title: "Convenience as a default"
            icon: scale
            question: "What happens when convenience becomes the default argument?"
            scope: "friction and overlooked trade-offs"
          - title: "Visible hiring decisions"
            icon: sparkles
            question: "Which parts of a hiring decision should never be hidden?"
            scope: "selection criteria and accountability"
          - title: "Useful transparency"
            icon: laptop
            question: "Can transparency make an online service harder to understand?"
            scope: "disclosure and cognitive load"
      - title: Access to Education
        lessons:
          - title: "Entry standards and access"
            icon: sparkles
            question: "How could an adult college balance entry standards with wider access?"
            scope: "admission pathways and barriers"
          - title: "Experience as credit"
            icon: graduation-cap
            question: "When should practical experience count toward a qualification?"
            scope: "prior learning and credentials"
          - title: "Who mentoring misses"
            icon: sparkles
            question: "What keeps a mentoring program from helping those most in need?"
            scope: "outreach and unmet need"
          - title: "A scholarship’s ripple effect"
            icon: wallet
            question: "How might a scholarship change the choices of an entire family?"
            scope: "household choices and financial mobility"
          - title: "Access versus participation"
            icon: sparkles
            question: "Why does availability not always lead to equal participation?"
            scope: "practical barriers and uptake"
      - title: Responsible Travel
        lessons:
          - title: "What visitor fees can do"
            icon: plane
            question: "What might a visitor fee achieve beyond raising revenue?"
            scope: "levies and demand management"
          - title: "Short stays and housing"
            icon: map-pin
            question: "How should a city respond when short stays reshape housing?"
            scope: "rental supply and zoning"
          - title: "Beyond visitor counts"
            icon: plane
            question: "When do visitor numbers stop being a useful measure of success?"
            scope: "tourism impact and alternative metrics"
          - title: "Spreading visitors"
            icon: cloud-rain
            question: "Can a destination spread visitors without creating new problems?"
            scope: "seasonality and displacement"
          - title: "Presenting traditions"
            icon: map-pin
            question: "Who should help decide how a local tradition is presented?"
            scope: "representation and community consent"
      - title: Public Health
        lessons:
          - title: "Personal choice and public health"
            icon: heart-pulse
            question: "When can an individual health choice become a public concern?"
            scope: "spillover effects and autonomy"
          - title: "Risk without alarm"
            icon: alarm-clock
            question: "How can campaigns communicate risk without alarming people?"
            scope: "risk framing and public messaging"
          - title: "Budgeting for prevention"
            icon: wallet
            question: "What makes prevention difficult to prioritize in a tight budget?"
            scope: "long-term savings and competing priorities"
