            question: "When has a health reminder actually helped you?"
            scope: "monitoring and habit cues"
          - title: "Regular meals"
            icon: utensils
            question: "Which change would make your meals more regular?"
            scope: "meal planning and schedules"
          - title: "Active with friends"
            icon: users
            question: "How can friends make an active hobby more enjoyable?"
            scope: "social motivation and shared exercise"
      - title: Smart Spending
        lessons:
          - title: "Repair or replace"
