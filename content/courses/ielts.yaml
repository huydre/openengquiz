  - slug: advanced-2
    title: Nâng cao 2
    cefr: C2
    words: 10
    summary: Nói tự nhiên, chính xác và có chiều sâu khi quan điểm xung đột.
    entry: Phân biệt được giả định với bằng chứng và giữ mạch nói khi phản biện.
    outcome: Điều chỉnh sắc thái, độ chắc chắn và cách trình bày trong câu hỏi khó.
    method: Luyện đối thoại có phản ví dụ, nói lại ngắn gọn rồi tự đánh giá lựa chọn từ.
    parts:
      - title: Ethical Reasoning
        lessons:
          - title: "Small benefits and severe harm"
            icon: map-pin
            question: "How should a decision maker weigh a widespread small benefit against a severe local harm?"
            scope: "aggregation and concentrated burdens"
          - title: "Consistent treatment and injustice"
